[project]
name = "datathon-mlet"
version = "0.1.0"
description = "Pipeline reprodutível de previsão de ações com DVC, MLflow e Docker"
readme = "README.md"
requires-python = ">=3.10,<3.14" 

authors = [
  { name = "Claudio" }
]

dependencies = [
  # Core
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",

  # ML
  "scikit-learn>=1.4",
  "joblib>=1.4",

  # Feature Engineering
  "statsmodels>=0.14",

  # Data
  "yfinance>=0.2.40",

  # Deep Learning
  "torch>=2.2",
  "tensorflow>=2.15",

  # MLOps
  "mlflow>=2.12",
  "dvc>=3.50",
  "faiss-cpu>=1.8.0",
  "sentence-transformers>=3.0",
  "newspaper3k>=0.2.8",
  "lxml_html_clean>=0.4.0",
  "pytest (>=9.0.3,<10.0.0)",
  "presidio-analyzer (>=2.2.362,<3.0.0)",
  "presidio-anonymizer (>=2.2.362,<3.0.0)",

  # Observabilidade
  "requests>=2.32.0",
  "prometheus-client>=0.20.0",
  "evidently>=0.5.0",
  "datasets>=2.20.0",
  "ragas>=0.1.10"
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "ruff>=0.5.0",
  "pytest>=8.0"
]

test = [
  "pytest>=8.0",
  "pytest-cov",
  "httpx",
  "pandera>=0.20"
]

# -------------------------------
# Packaging (src layout)
# -------------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# -------------------------------
# Black (formatter)
# -------------------------------
[tool.black]
line-length = 100
target-version = ["py310"]
skip-string-normalization = false

# -------------------------------
# Ruff (lint)
# -------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
]
ignore = [
  "E501"
]

# -------------------------------
# Pytest
# -------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = [".", "src"]

# -------------------------------
# Build system
# -------------------------------
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"